# SPDX-License-Identifier: MPL-2.0
[package]
name = "typed-wasm-verify"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Post-codegen verifier for typed-wasm L7 (aliasing) and L10 (linearity) constraints on emitted wasm modules"
repository = "https://github.com/hyperpolymath/typed-wasm"
readme = "README.md"

[features]
default = []
# L2 region-binding + access-site carrier codec for typed-wasm
# proposal 0001 (`[accepted]` 2026-05-30 → ADR-0002) and proposal 0002
# (`[accepted]` 2026-05-30 → ADR-0003). Feature gate retained as
# `unstable-l2` while Phase 3 stabilisation is open. Enables:
#   - `parse_regions_section_payload` / `build_regions_section_payload`
#     + `RegionEntry` / `FieldEntry` (proposal 0001)
#   - `parse_access_sites_section_payload` /
#     `build_access_sites_section_payload` + `AccessSiteEntry`
#     (proposal 0002)
#   - `verify_regions_from_module` (PR #107) and
#     `verify_access_sites_from_module` (PR #109) verifier passes.
unstable-l2 = []
# L15 capability-lattice carrier codec for typed-wasm proposal 0001
# (`[accepted]` 2026-05-30 → ADR-0002). Feature gate retained as
# `unstable-l15` while Phase 3 stabilisation is open. Enables
# `parse_capabilities_section_payload` /
# `build_capabilities_section_payload` + `CapabilityEntry` /
# `FunctionCapabilities` + `verify_capabilities_from_module` (PR #109).
# L15-C (per-call-site grants) is a separate proposal 0004 (`[draft]`).
unstable-l15 = []
# L13 cross-module region-imports carrier for typed-wasm proposal 0003
# (`[draft]`, typed-wasm#140 refs #95). Implies `unstable-l2`: the import
# table cross-references `typedwasm.regions` field entries via the
# high-bit `target_region` convention. Enables:
#   - `parse_region_imports_section_payload` /
#     `build_region_imports_section_payload` +
#     `RegionImportEntry` / `ImportedFieldEntry` + `IMPORT_TABLE_BASE`
#   - `verify_region_imports_from_module` (this PR) — self-consistency
#     only; cross-module schema agreement (`SchemaSub`) defers to a
#     later `verify_link_graph` pass per proposal 0003 §"Open
#     questions" #4 default option a.
unstable-l13-imports = ["unstable-l2"]

[dependencies]
# Exact pins: wasmparser's 0.x line ships API breaks on every minor bump
# (0.221 -> 0.250 reshaped the import iterator). Keep these locked so the
# next dependabot bump shows up as a visible Cargo.toml diff and forces a
# deliberate port rather than a silent lockfile move.
wasmparser = "=0.251.0"
thiserror = "2"

[dev-dependencies]
wasm-encoder = "=0.251.0"
