# SPDX-License-Identifier: MPL-2.0
[package]
name = "typed-wasm-verify"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Post-codegen verifier for typed-wasm L7 (aliasing) and L10 (linearity) constraints on emitted wasm modules"
repository = "https://github.com/hyperpolymath/typed-wasm"
readme = "README.md"

[dependencies]
# Exact pins: wasmparser's 0.x line ships API breaks on every minor bump
# (0.221 -> 0.250 reshaped the import iterator). Keep these locked so the
# next dependabot bump shows up as a visible Cargo.toml diff and forces a
# deliberate port rather than a silent lockfile move.
wasmparser = "=0.250.0"
thiserror = "2"

[dev-dependencies]
wasm-encoder = "=0.250.0"
