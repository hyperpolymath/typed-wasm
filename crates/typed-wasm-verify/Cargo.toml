# SPDX-License-Identifier: MPL-2.0
[package]
name = "typed-wasm-verify"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
description = "Post-codegen verifier for typed-wasm L7 (aliasing) and L10 (linearity) constraints on emitted wasm modules"
repository = "https://github.com/hyperpolymath/typed-wasm"
readme = "README.md"

[features]
default = []
# Pre-stages the L2 region-binding carrier codec for typed-wasm proposal
# 0001 (typed-wasm#76, refs #34). UNSTABLE: wire format may change before
# the proposal is [accepted]. Enables `parse_regions_section_payload` /
# `build_regions_section_payload` and the `RegionEntry` / `FieldEntry`
# types. Also enables `parse_access_sites_section_payload` /
# `build_access_sites_section_payload` and `AccessSiteEntry` from
# proposal 0002 (#78) — access-sites is an L2 enforcement carrier and
# travels with the L2 feature gate. Does NOT enable a
# `verify_region_binding` pass — that's a separate plumb step.
unstable-l2 = []
# Pre-stages the L15 capability-lattice carrier codec for typed-wasm
# proposal 0001. UNSTABLE: wire format may change before [accepted].
# Enables `parse_capabilities_section_payload` /
# `build_capabilities_section_payload` and the `CapabilityEntry` /
# `FunctionCapabilities` types. L15-C (per-call-site grants) is deferred
# to a separate proposal (tracked by #96).
unstable-l15 = []
# L13 cross-module region-imports carrier for typed-wasm proposal 0003
# (`[draft]`, typed-wasm#140 refs #95). Implies `unstable-l2`: the import
# table cross-references `typedwasm.regions` field entries via the
# high-bit `target_region` convention. Enables:
#   - `parse_region_imports_section_payload` /
#     `build_region_imports_section_payload` +
#     `RegionImportEntry` / `ImportedFieldEntry` + `IMPORT_TABLE_BASE`
#   - `verify_region_imports_from_module` (this PR) — self-consistency
#     only; cross-module schema agreement (`SchemaSub`) defers to a
#     later `verify_link_graph` pass per proposal 0003 §"Open
#     questions" #4 default option a.
unstable-l13-imports = ["unstable-l2"]

[dependencies]
# Exact pins: wasmparser's 0.x line ships API breaks on every minor bump
# (0.221 -> 0.250 reshaped the import iterator). Keep these locked so the
# next dependabot bump shows up as a visible Cargo.toml diff and forces a
# deliberate port rather than a silent lockfile move.
wasmparser = "=0.256.0"
thiserror = "2"

[dev-dependencies]
wasm-encoder = "=0.256.0"
