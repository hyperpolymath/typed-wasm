#
# e2e.yml — End-to-end validation for typed-wasm.
#
# Runs on every PR and push to main. Three jobs:
#   structural   — fast structural checks (no compiler required)
#   smoke        — Node.js smoke test (ReScript parser + example files)
#   build-e2e    — Full Idris2 + Zig build then E2E
#   cargo-verify — Cargo workspace build + test (typed-wasm-verify crate)
name: E2E Validation

on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  # --------------------------------------------------------------------------
  # Job 1: Structural checks (no toolchain needed — fast gate)
  # --------------------------------------------------------------------------
  structural:
    name: Structural E2E (no-build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run structural E2E checks
        run: E2E_BUILD=0 bash tests/e2e.sh

  # --------------------------------------------------------------------------
  # Job 2: Smoke test — Node.js parser validation
  # --------------------------------------------------------------------------
  smoke:
    name: Smoke test (Node.js ReScript parser)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '25'

      - name: Install npm deps (rescript build prerequisite)
        run: npm install --no-audit --no-fund --silent

      - name: Build ReScript parser
        run: node_modules/.bin/rescript build

      - name: Run smoke test
        run: node tests/smoke/e2e-smoke.mjs

      - name: Run aspect test (claim envelope)
        run: node tests/aspect/claim-envelope.mjs

      - name: Run parser benchmark (smoke; full run is local)
        run: BENCH_ITERS=20 node benchmarks/parser-bench.mjs

  # --------------------------------------------------------------------------
  # Job 3: Full Idris2 + Zig build then E2E
  # --------------------------------------------------------------------------
  build-e2e:
    name: Build + E2E (Idris2 + Zig)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # ---- Idris2 ----
      # 0.8.0 is the version the src/abi/ proofs are written against
      # (Proofs.idr:629 "verified with Idris2 0.8.0"; Layout.idr / Types.idr
      # carry 0.8-specific workarounds for reduction + interface resolution).
      # Older versions will fail the standalone build.
      - name: Install Idris2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgmp-dev
          IDRIS2_VERSION="0.8.0"
          curl -fsSL \
            "https://github.com/idris-lang/Idris2/releases/download/v${IDRIS2_VERSION}/idris2-${IDRIS2_VERSION}-ubuntu-20.04.tar.gz" \
            -o /tmp/idris2.tar.gz || true
          if [ -f /tmp/idris2.tar.gz ]; then
            tar -xzf /tmp/idris2.tar.gz -C /usr/local --strip-components=1
          fi

      # ---- Zig ----
      # 0.15.1 is the version ffi/zig/build.zig is written against (header
      # comment "Updated for Zig 0.15+ API (addLibrary / createModule
      # pattern)"). 0.12 lacks `b.addLibrary` and the `.root_module` field
      # and will not parse the build script.
      # Direct curl was failing on every PR (#44 CI: curl exit 22 / 404)
      # because Zig 0.14+ flipped tarball naming from zig-OS-ARCH-VERSION
      # to zig-ARCH-OS-VERSION. mlugg/setup-zig handles the naming, fetches
      # from ziglang.org with a community mirror fallback, and is SHA-pinned
      # to v2.2.1.
      - name: Install Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: '0.15.1'

      # ---- Node (for smoke test within E2E script) ----
      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '25'

      # ---- Full E2E ----
      - name: Run full E2E (with build checks)
        run: E2E_BUILD=1 bash tests/e2e.sh

  # --------------------------------------------------------------------------
  # Job 4: Cargo workspace build + test (typed-wasm-verify)
  #
  # Catches wasmparser / wasm-encoder API breaks that previously slipped
  # through (see commit 7223ef0). Runs on every PR so dependabot bumps
  # cannot land green when they break the post-codegen verifier.
  # --------------------------------------------------------------------------
  cargo-verify:
    name: Cargo build + test (typed-wasm-verify)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # ubuntu-latest ships rustup preinstalled; call it directly rather than
      # routing through dtolnay/rust-toolchain (the SHA-pinned action was
      # returning exit 1 on every PR, blocking the verifier job — see #44 CI).
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          cargo --version

      - name: Cargo build (workspace)
        run: cargo build --workspace --locked

      - name: Cargo test (workspace)
        run: cargo test --workspace --locked
