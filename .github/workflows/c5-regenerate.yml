#
# c5-regenerate.yml — Regenerate the C5.1 corpus from .affine sources
# and diff against the vendored .wasm bytes. Drift in affinescript's
# wasm codegen surfaces as a failed PR check on this workflow.
#
# Scope: only runs on PRs that touch the fixture directory or this
# workflow file. Building affinescript is expensive (~5 min); we don't
# want it on every PR. The verifier itself is exercised by
# `cargo test --test cross_compat_real` in `e2e.yml` (cargo-verify
# job) against the vendored bytes — that's the per-PR oracle.
name: C5.1 Fixture Regenerate

on:
  pull_request:
    paths:
      - 'crates/typed-wasm-verify/tests/fixtures/c5_real/**'
      - '.github/workflows/c5-regenerate.yml'

permissions:
  contents: read

env:
  # SHA of hyperpolymath/affinescript that the vendored .wasm bytes
  # were captured against. Bump this together with the fixtures README
  # (`Provenance` section) when intentionally re-vendoring against a
  # newer affinescript.
  AFFINESCRIPT_SHA: '21edc159caee06a930cb7339b3e729ed5627b823'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    name: Regenerate C5.1 fixtures and diff
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout typed-wasm
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout affinescript at pinned SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperpolymath/affinescript
          ref: ${{ env.AFFINESCRIPT_SHA }}
          path: affinescript

      - name: Install OCaml
        uses: ocaml/setup-ocaml@f92e0606b7ae4873dd1238465ea4bf6f8e40d85c # v3
        with:
          ocaml-compiler: '4.14.2'

      - name: Install affinescript opam dependencies
        working-directory: affinescript
        run: opam install . --deps-only --yes

      - name: Build affinescript
        working-directory: affinescript
        run: opam exec -- dune build

      - name: Regenerate fixtures into a scratch directory
        run: |
          set -euo pipefail
          mkdir -p /tmp/c5-regen
          AFFINESCRIPT=affinescript/_build/default/bin/main.exe
          FIXDIR=crates/typed-wasm-verify/tests/fixtures/c5_real
          for src in "$FIXDIR"/*.affine; do
            base=$(basename "$src" .affine)
            opam exec --cwd=affinescript -- ../"$AFFINESCRIPT" compile \
              "../$src" \
              -o "/tmp/c5-regen/$base.wasm" \
              2>&1 | tee -a /tmp/c5-regen/build.log
          done
          ls -la /tmp/c5-regen/

      - name: Diff regenerated bytes against vendored bytes
        run: |
          set -euo pipefail
          FIXDIR=crates/typed-wasm-verify/tests/fixtures/c5_real
          fail=0
          for src in "$FIXDIR"/*.affine; do
            base=$(basename "$src" .affine)
            vendored="$FIXDIR/$base.wasm"
            regen="/tmp/c5-regen/$base.wasm"
            if ! cmp -s "$vendored" "$regen"; then
              echo "::error file=$vendored::C5.1 drift — affinescript ${{ env.AFFINESCRIPT_SHA }} emits different bytes for $base.affine than the vendored $base.wasm. Either regenerate the vendored bytes (and update the AFFINESCRIPT_SHA in this workflow + the fixtures README) or revert the producer-side change."
              echo "--- vendored ---"
              xxd "$vendored" | head -20
              echo "--- regenerated ---"
              xxd "$regen" | head -20
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "All C5.1 fixtures match the regenerated output."
