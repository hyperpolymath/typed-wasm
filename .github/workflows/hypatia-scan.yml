# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  # standards#1035: hypatia-scan-reusable uploads SARIF (codeql-action/upload-sarif)
  # and deposits a report artifact. The callee cannot escalate, and its job-level
  # block replaces this map rather than merging with it - so the grant belongs here.
  actions: read

jobs:
  hypatia:
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@da2c748aad55c1a1dcba00b60fe4a35017bc6540
