# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: OSSF Scorecard

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scorecard:
    uses: metadatastician/standards/.github/workflows/scorecard-reusable.yml@e064539116c2dcfdf282a4749dbd58c69961c7e6
    permissions:
      contents: read
      security-events: write
      id-token: write
      # standards#1035: scorecard-reusable runs actions/upload-artifact in the same job
      # (043fb46d, v7.0.1). This block REPLACES the workflow-level map, so actions:read
      # has to be granted here or the upload step fails - and 3 of 7 estate callers of
      # this reusable omit it.
      actions: read
