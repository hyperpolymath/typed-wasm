name: Secret Scanner

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    # The reusable's gitleaks job requests pull-requests: write (PR summary
    # comment) and actions: read (workflow-run metadata) at job level; the
    # caller must grant at least that or the run startup-fails.
    permissions:
      contents: read
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@da2c748aad55c1a1dcba00b60fe4a35017bc6540
    secrets: inherit
