# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Layering-contract gate: enforces the inter-project invariants (I1 dependency
# direction + I3 shared-ABI drift) that keep this repo composable with the rest
# of the stack. See CONTRACT.adoc. Self-contained (no reusable); runnable
# locally as tools/check-contract.sh.
# Also gates the grade kernel (I2, extend don't redefine, applied to grades):
# tools/check-grade-kernel.sh and tools/check-kernel-proofs.sh, both runnable
# locally.
name: Contract Gate
on:
  pull_request:
    branches: ['**']
  push:
    branches: [main, master]
permissions:
  contents: read
concurrency:
  group: contract-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contract:
    name: Layering contract (I1 + I3)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Run contract gate
        run: bash tools/check-contract.sh

  # Grade kernel (PWL-01): the one definition of min-plus, max-plus and min-max.
  # Checkout-only and toolchain-free, so it runs on every PR in seconds.
  # It lives in this workflow because actions.lock is keyed by workflow path:
  # a new workflow file would be rejected at startup until the lock is
  # regenerated, and this one already holds the only action it needs.
  grade-kernel:
    name: Grade kernel (one min-plus, one max-plus)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Gate self-test (negative control — seeded duplicates must be caught)
        run: bash tools/check-grade-kernel.sh --self-test
      - name: Grep gate
        run: bash tools/check-grade-kernel.sh

  # The mechanical falsifiers behind the kernel: Idris2 0.8.0 builds the ABI,
  # refuses tests/reject/*.idr for the intended reasons, and agrees with the
  # PINNED Agda kernel (resource-algebra at the fetch-siblings.sh pin, Agda
  # --safe --without-K --cubical-compatible, PROOF-POLICY §2.1)
  # on tests/transcription/ops.tsv; both provers refuse the wrong rows.
  # Idris2 publishes no binaries and its release-tarball URL 404s (see
  # e2e.yml build-e2e), so 0.8.0 is built from source with Chez Scheme,
  # fetched by the commit its v0.8.0 tag names (a tag can move; the SHA
  # cannot).
  kernel-proofs:
    name: Grade kernel proofs (Idris2 0.8.0 + Agda)
    # Agda 2.6.4.3, the Debian agda-bin package the sibling repositories pin
    # (resource-algebra, occupancy-types and choreographic-types proofs.yml),
    # so this gate re-checks their proofs on the prover their own CI uses.
    # tools/check-kernel-proofs.sh refuses any other Agda. Until 2026-11-09
    # this job ran Ubuntu 24.04's Agda 2.6.3.
    runs-on: ubuntu-latest
    container: debian:trixie-slim
    timeout-minutes: 40
    env:
      IDRIS2_COMMIT: 15a3e4e70843f7a34100f6470c04b791330788df  # v0.8.0
    steps:
      - name: Install Chez Scheme, GMP, build tools and the pinned Agda
        run: |
          apt-get update -qq
          apt-get install --no-install-recommends -y -qq ca-certificates git make gcc libc6-dev \
            libgmp-dev chezscheme agda-bin=2.6.4.3-1+b2
          test "$(agda --version)" = 'Agda version 2.6.4.3'
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Build Idris2 0.8.0 from source
        run: |
          git init --quiet "$RUNNER_TEMP/idris2-src"
          git -C "$RUNNER_TEMP/idris2-src" fetch --quiet --depth 1 https://github.com/idris-lang/Idris2 "$IDRIS2_COMMIT"
          git -C "$RUNNER_TEMP/idris2-src" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/idris2-src" rev-parse HEAD)" = "$IDRIS2_COMMIT"
          # Local tag on the verified commit, so the Makefile reports the
          # release version (0.8.0) rather than 0.8.0-<sha>.
          git -C "$RUNNER_TEMP/idris2-src" tag v0.8.0
          # Debian names the Chez binary chezscheme; Ubuntu also ships scheme.
          SCHEME="$(command -v chezscheme || command -v scheme)"
          make -C "$RUNNER_TEMP/idris2-src" bootstrap SCHEME="$SCHEME" -j"$(nproc)" > "$RUNNER_TEMP/idris2-build.log" 2>&1 \
            || { tail -60 "$RUNNER_TEMP/idris2-build.log"; exit 1; }
          make -C "$RUNNER_TEMP/idris2-src" install > "$RUNNER_TEMP/idris2-install.log" 2>&1 \
            || { tail -60 "$RUNNER_TEMP/idris2-install.log"; exit 1; }
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"
      - name: Fetch siblings at their pins
        run: bash scripts/fetch-siblings.sh
      - name: Kernel proofs
        run: bash tools/check-kernel-proofs.sh
